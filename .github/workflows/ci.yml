name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://admin_alquiler:test-password@localhost:5432/admin_alquiler_test
      REDIS_URL: redis://localhost:6379
      SEED_LOCALE: es-CO
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: admin_alquiler_test
          POSTGRES_USER: admin_alquiler
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_alquiler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@admin-alquiler/database' db:generate
      - run: bun run --filter '@admin-alquiler/database' db:migrate
      - run: bun run --filter '@admin-alquiler/database' db:seed
      - run: bun run test:integration
